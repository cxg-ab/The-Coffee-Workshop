name: Theme Quality & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Shopify Theme Bug & Syntax Audit (Liquid)
  theme-check:
    name: Shopify Theme Check (Liquid Bug Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Shopify Theme Check
        uses: Shopify/theme-check-action@v1
        with:
          path: 'theme'

  # 2. Tailwind & JS Build Verification
  build-check:
    name: Tailwind CSS & JS Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

# NOTE: CodeQL security scanning lives in .github/workflows/codeql.yml
# (a single, dedicated workflow) to avoid running CodeQL twice per push.
