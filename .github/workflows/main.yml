name: Theme Quality & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Shopify Theme Bug & Syntax Audit (Liquid)
  theme-check:
    name: Shopify Theme Check (Liquid Bug Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Shopify Theme Check
        uses: Shopify/theme-check-action@v1
        with:
          path: 'theme'

# NOTE: There is intentionally NO CSS build step.
# theme/assets/application.css is hand-maintained and is the single source of
# truth. The old Tailwind pipeline (src/styles/application.css + postcss) was
# retired because the source had drifted far behind the compiled file —
# running it would have wiped hand-written CSS (filter panel, origin cards,
# PDP, customer accounts). Edit theme/assets/application.css directly.

# NOTE: CodeQL security scanning lives in .github/workflows/codeql.yml
# (a single, dedicated workflow) to avoid running CodeQL twice per push.
